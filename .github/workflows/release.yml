name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    name: verify · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke:install

  publish:
    name: publish npm and GitHub release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) throw new Error('tag and package version differ')"
      - name: Build release package
        id: pack
        run: echo "tarball=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: Attest release package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Publish package with provenance
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release from the verified tag
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.tarball }}#npm package" --verify-tag --generate-notes --title "orangebox $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
