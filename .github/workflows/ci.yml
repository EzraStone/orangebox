name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  # Cheap, single-platform checks that do not need the matrix.
  docs:
    name: docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # docs/spec.html is a copy of the canonical spec; drift would silently
      # publish a different document from the one in the repo.
      - run: npm run docs:check

  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # §15 asks for 18/20/22. better-sqlite3 — the one dependency §02.1
        # allows — requires Node 20+, and Node 18 went EOL in April 2025, so
        # the matrix moves up a version rather than pinning a dead runtime.
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          # The proxy leans on OS-specific socket behaviour (client aborts,
          # refused connections), so prove it on Windows too. Two Node versions
          # there because the local dev machine only ever runs 24 — if 22 fails
          # where 24 passes, that is a runtime difference and not the OS.
          - node: '22'
            os: windows-latest
          - node: '24'
            os: windows-latest
          - node: '22'
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite must not touch the network: every "upstream" is a local
      # node:http server (§17.1 check 10).
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      - name: Test a fresh packed install
        shell: bash
        run: |
          set -o pipefail
          npm run smoke:install 2>&1 | tee smoke-output.txt

      # Job logs and artifacts both need a token to read through the API, and
      # job summaries do not appear in check-run output — which leaves a red run
      # undiagnosable by anything but a human with a browser session. A check
      # run's output *is* readable unauthenticated, so publish the failure there.
      - name: Surface the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any step above can be the one that failed, and until now a failure
          # before npm test produced output left nothing published at all: jq
          # --rawfile aborts on a missing file, so the check run was never
          # created and the run could not be diagnosed without a browser.
          touch test-output.txt smoke-output.txt
          {
            echo "## Failure on ${{ matrix.os }} / node ${{ matrix.node }}"
            echo
            echo "### npm test"
            echo '```'
            tail -c 6000 test-output.txt
            echo '```'
            echo "### smoke install"
            echo '```'
            tail -c 2000 smoke-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cat test-output.txt smoke-output.txt > combined-output.txt

          jq -n \
            --arg name "test output · ${{ matrix.os }} · node ${{ matrix.node }}" \
            --arg sha "$GITHUB_SHA" \
            --rawfile body combined-output.txt \
            '{name: $name, head_sha: $sha, status: "completed", conclusion: "neutral",
              output: {title: "npm test output", summary: ("```\n" + $body + "\n```")}}' \
            > check-payload.json
          gh api "repos/$GITHUB_REPOSITORY/check-runs" --input check-payload.json > /dev/null \
            || echo "could not publish check run (continuing)"

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            test-output.txt
            smoke-output.txt
          if-no-files-found: ignore
          retention-days: 7
