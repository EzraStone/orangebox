<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>orangebox</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111318">
<meta name="application-name" content="orangebox">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="orangebox">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
</head>
<body>
<noscript>orangebox's UI needs JavaScript. The JSON API under /api works without it.</noscript>

<div class="shell" id="shell">
  <aside class="pane pane-runs" id="pane-runs" aria-label="Runs">
    <div class="pane-head">
      <span class="brand"><span class="mark">▮</span>orangebox</span>
      <span class="spacer"></span>
      <span class="pane-title" id="runs-count"></span>
      <button class="iconbtn" id="find-open" type="button" title="Search recorded content (/)" aria-label="Search recorded content">&#8981;</button>
      <button class="iconbtn" id="tools-open" type="button" title="Tool usage across runs (t)" aria-label="Tool usage across runs">&#9874;</button>
      <button class="iconbtn" id="spend-open" type="button" title="Spend across runs" aria-label="Spend across runs">$</button>
      <button class="iconbtn mobile-manage-btn" id="mobile-manage" type="button" title="Manage paired mobile devices" aria-label="Manage paired mobile devices" hidden>M</button>
      <button class="iconbtn notify-btn" id="notifications" type="button" title="Enable completion notifications" aria-label="Enable completion notifications" hidden>!</button>
      <button class="iconbtn install-btn" id="pwa-install" type="button" title="Install orangebox" aria-label="Install orangebox" hidden>+</button>
      <button class="iconbtn" id="runs-collapse" type="button" title="Collapse runs (\)" aria-label="Collapse runs pane" aria-expanded="true">&#x00AB;</button>
    </div>
    <div class="run-filters" aria-label="Filter runs">
      <input id="run-search" type="search" placeholder="Search runs or tags" aria-label="Search runs or tags">
      <div class="run-filter-row">
        <input id="run-model" type="search" placeholder="Model" aria-label="Filter by model">
        <input id="run-provider" type="search" placeholder="Provider" aria-label="Filter by provider">
        <input id="run-tool" type="search" placeholder="Tool" aria-label="Filter by tool">
        <select id="run-errors" aria-label="Filter by error state">
          <option value="">All</option>
          <option value="errors">Errors</option>
          <option value="clean">Clean</option>
        </select>
      </div>
      <div class="run-filter-row numeric-filters">
        <input id="run-latency" type="number" min="0" step="100" placeholder="Min latency ms" aria-label="Minimum call latency in milliseconds">
        <input id="run-cost" type="number" min="0" step="0.001" placeholder="Min cost $" aria-label="Minimum run cost in dollars">
      </div>
      <div class="run-filter-row date-filters">
        <label>From<input id="run-from" type="date" aria-label="Runs from date"></label>
        <label>To<input id="run-to" type="date" aria-label="Runs through date"></label>
      </div>
    </div>
    <div class="pane-body">
      <ul class="runlist" id="runlist"></ul>
      <button class="load-more" id="runs-more" type="button" hidden>Load more</button>
    </div>
    <footer class="trust">This database contains your prompts. So do its exports.</footer>
  </aside>

  <main class="pane pane-timeline" id="pane-timeline">
    <div class="pane-head">
      <button class="iconbtn" id="runs-expand" type="button" title="Show runs (\)" aria-label="Show runs pane">&#x00BB;</button>
      <div class="run-head-slot" id="run-header"></div>
    </div>
    <div class="pane-body" id="timeline-scroll">
      <div class="timeline" id="timeline"></div>
    </div>
  </main>

  <section class="pane pane-detail" id="pane-detail" aria-label="Call detail">
    <div class="drag" id="drag" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
    <div class="pane-head" id="detail-head"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pane-body"><div class="tabpanel" id="tabpanel" role="tabpanel"></div></div>
  </section>
</div>

<button class="mobile-scrim" id="mobile-scrim" type="button" aria-label="Close runs pane" tabindex="-1"></button>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <button id="mobile-runs" type="button" aria-label="Show runs"><span aria-hidden="true">&#9776;</span><span>Runs</span></button>
  <button id="mobile-timeline" type="button" aria-label="Show timeline"><span aria-hidden="true">&#9646;</span><span>Timeline</span></button>
  <button id="mobile-detail" type="button" aria-label="Show selected call detail" disabled><span aria-hidden="true">{ }</span><span>Detail</span></button>
  <span class="mobile-live" id="mobile-live" role="status"><span class="dot"></span><span>Live</span></span>
</nav>

<div class="pill" id="status-pill" hidden></div>

<script type="module" src="/app.js"></script>
</body>
</html>
