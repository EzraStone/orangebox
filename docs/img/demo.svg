<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" role="img" aria-label="An 18-second loop: starting orangebox in a terminal, running an agent, and watching three calls appear on the timeline — a plan, a tool loop with a client-side gap, and a streamed synthesis with a 108 millisecond time to first token.">
  <title>orangebox recording an agent run</title>
  <desc>Top pane: a terminal starting orangebox, then running an agent that makes three LLM calls. Bottom pane: the orangebox timeline filling in live — call 01 plan, call 02 tool loop with two get_weather chips and a 2.1 second client-side gap, and call 03 streaming with time to first token, tokens and estimated cost.</desc>

  <style>
    .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .dim  { fill: #9AA0A8; }
    .txt  { fill: #E8EAED; }
    .org  { fill: #FF5A1F; }
    .blu  { fill: #5B8DEF; }
    .grn  { fill: #86D9A5; }
    .red  { fill: #F4A9AB; }

    /* Every revealed group runs the same 18 s cycle, each with its own start,
       so the whole storyboard stays in step and resets together. */
    [class*="r"] { opacity: 0; }
    .r0  { animation: r0  18s linear infinite; }
    .r1  { animation: r1  18s linear infinite; }
    .r2  { animation: r2  18s linear infinite; }
    .r3  { animation: r3  18s linear infinite; }
    .r4  { animation: r4  18s linear infinite; }
    .r5  { animation: r5  18s linear infinite; }
    .r6  { animation: r6  18s linear infinite; }
    .r7  { animation: r7  18s linear infinite; }
    .r8  { animation: r8  18s linear infinite; }
    .r9  { animation: r9  18s linear infinite; }
    .r10 { animation: r10 18s linear infinite; }
    .r11 { animation: r11 18s linear infinite; }
    .r12 { animation: r12 18s linear infinite; }
    .r13 { animation: r13 18s linear infinite; }
    .r14 { animation: r14 18s linear infinite; }
    .r15 { animation: r15 18s linear infinite; }
    .r16 { animation: r16 18s linear infinite; }
    .r17 { animation: r17 18s linear infinite; }
    .r18 { animation: r18 18s linear infinite; }
    .r19 { animation: r19 18s linear infinite; }
    .r20 { animation: r20 18s linear infinite; }

    @keyframes r0  { 0%,0%    {opacity:0} 2.2%,96%  {opacity:1} 100% {opacity:0} }
    @keyframes r1  { 0%,1.7%  {opacity:0} 3.9%,96%  {opacity:1} 100% {opacity:0} }
    @keyframes r2  { 0%,5.6%  {opacity:0} 7.8%,96%  {opacity:1} 100% {opacity:0} }
    @keyframes r3  { 0%,7.2%  {opacity:0} 9.4%,96%  {opacity:1} 100% {opacity:0} }
    @keyframes r4  { 0%,8.9%  {opacity:0} 11.1%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r5  { 0%,10.6% {opacity:0} 12.8%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r6  { 0%,13.3% {opacity:0} 15.5%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r7  { 0%,16.1% {opacity:0} 18.3%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r8  { 0%,18.9% {opacity:0} 21.1%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r9  { 0%,22.2% {opacity:0} 24.4%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r10 { 0%,28.9% {opacity:0} 31.1%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r11 { 0%,32.2% {opacity:0} 34.4%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r12 { 0%,37.8% {opacity:0} 40.0%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r13 { 0%,44.4% {opacity:0} 46.6%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r14 { 0%,47.8% {opacity:0} 50.0%,96% {opacity:1} 100% {opacity:0} }
    /* the in-flight ring: appears with call 03, gone the moment it resolves */
    @keyframes r15 { 0%,47.8% {opacity:0} 50.0%,59%  {opacity:1} 61.1%,100% {opacity:0} }
    @keyframes r16 { 0%,53.3% {opacity:0} 55.5%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r17 { 0%,56.7% {opacity:0} 58.9%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r18 { 0%,61.1% {opacity:0} 63.3%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r19 { 0%,65.6% {opacity:0} 67.8%,96% {opacity:1} 100% {opacity:0} }
    @keyframes r20 { 0%,70.0% {opacity:0} 72.2%,96% {opacity:1} 100% {opacity:0} }

    .pulse  { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% {opacity:.95; r:9} 50% {opacity:.35; r:10.5} }

    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }

    /* Anyone who has asked the browser to calm down gets a still frame. */
    @media (prefers-reduced-motion: reduce) {
      [class*="r"] { opacity: 1; animation: none; }
      .r15 { opacity: 0; }
      .pulse, .cursor { animation: none; }
    }
  </style>

  <!-- ===================== terminal pane ===================== -->
  <g class="r0">
    <rect x="0" y="0" width="900" height="240" rx="7" fill="#101216"/>
    <rect x=".5" y=".5" width="899" height="239" rx="6.5" fill="none" stroke="#2A2E36"/>
    <circle cx="20" cy="17" r="4" fill="#E5484D" fill-opacity=".7"/>
    <circle cx="36" cy="17" r="4" fill="#E8A33D" fill-opacity=".7"/>
    <circle cx="52" cy="17" r="4" fill="#3FB868" fill-opacity=".7"/>
    <text class="mono dim" x="450" y="21" text-anchor="middle" font-size="10.5">bash</text>
  </g>

  <text class="mono grn r0" x="18" y="52">$</text>
  <text class="mono txt r1" x="32" y="52">npx -y github:EzraStone/orangebox</text>

  <text class="mono r2" x="18" y="76"><tspan class="org">  ▮</tspan><tspan class="txt"> orangebox v1.0.0 — flight recorder for AI agents</tspan></text>
  <text class="mono r3" x="18" y="93"><tspan class="org">  ▮</tspan><tspan class="dim"> recording on   http://127.0.0.1:4100</tspan></text>
  <text class="mono r4" x="18" y="110"><tspan class="org">  ▮</tspan><tspan class="dim"> database       ~/.orangebox/orangebox.db  (0 runs, 92 KB)</tspan></text>
  <text class="mono r5" x="18" y="127"><tspan class="org">  ▮</tspan><tspan class="dim"> ui             http://127.0.0.1:4100  (opening browser…)</tspan></text>

  <text class="mono grn r7" x="18" y="155">$</text>
  <text class="mono txt r7" x="32" y="155">node examples/demo-agent.mjs</text>

  <text class="mono r8"  x="18" y="179"><tspan class="org">  ▮</tspan><tspan class="dim"> call 01 — plan</tspan></text>
  <text class="mono r10" x="18" y="196"><tspan class="org">  ▮</tspan><tspan class="dim"> call 02 — tool loop (get_weather, get_weather)</tspan></text>
  <text class="mono r13" x="18" y="213"><tspan class="org">  ▮</tspan><tspan class="dim"> call 03 — synthesize (streamed)</tspan></text>
  <text class="mono txt r16" x="18" y="230">   Paris is 18 °C and clear; Oslo is 6 °C with light rain.</text>

  <rect class="cursor r17" x="425" y="221" width="6" height="12" fill="#E8EAED"/>

  <!-- ===================== orangebox UI pane ===================== -->
  <g class="r6">
    <rect x="0" y="252" width="900" height="298" rx="7" fill="#14161A"/>
    <rect x=".5" y="252.5" width="899" height="297" rx="6.5" fill="none" stroke="#2A2E36"/>

    <text class="sans" x="20" y="278" font-size="12.5" font-weight="700" fill="#E8EAED"><tspan class="org">▮ </tspan>orangebox</text>
    <line x1="118" y1="264" x2="118" y2="288" stroke="#2A2E36"/>
    <text class="sans" x="134" y="278" font-size="12.5" font-weight="600" fill="#E8EAED">weather comparison agent</text>
    <line x1="1" y1="296" x2="899" y2="296" stroke="#2A2E36"/>
  </g>

  <!-- run header totals, once the run has finished -->
  <g class="r19">
    <text class="mono dim" x="620" y="278" font-size="10.5">11k in / 441 out</text>
    <text class="mono dim" x="726" y="278" font-size="10.5">$0.080 est.</text>
    <text class="mono dim" x="806" y="278" font-size="10.5">27.4 s</text>
  </g>

  <!-- call 01 -->
  <g class="r9">
    <circle cx="34" cy="326" r="4.5" fill="#FF5A1F"/>
    <text class="mono dim" x="52" y="324" font-size="10.5">call 01</text>
    <text class="sans" x="104" y="324" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
    <text class="mono txt" x="204" y="324" font-size="11">1.9 s</text>
    <rect x="250" y="314" width="94" height="15" rx="3" fill="none" stroke="#2A2E36"/>
    <text class="mono dim" x="297" y="325" text-anchor="middle" font-size="9.5">stop: end_turn</text>
    <text class="mono dim" x="102" y="342" font-size="10.5">2.4k in / 38 out</text>
    <text class="mono dim" x="210" y="342" font-size="10.5">$0.024 est.</text>
  </g>

  <!-- call 02 -->
  <g class="r11">
    <circle cx="34" cy="382" r="4.5" fill="#FF5A1F"/>
    <text class="mono dim" x="52" y="380" font-size="10.5">call 02</text>
    <text class="sans" x="104" y="380" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
    <text class="mono txt" x="204" y="380" font-size="11">3.2 s</text>
    <rect x="250" y="370" width="84" height="15" rx="3" fill="#5B8DEF" fill-opacity=".12" stroke="#24365E"/>
    <text class="mono blu" x="292" y="381" text-anchor="middle" font-size="9.5">stop: tool_use</text>
    <text class="mono dim" x="102" y="398" font-size="10.5">2.7k in / 114 out</text>
    <text class="mono dim" x="216" y="398" font-size="10.5">$0.017 est.</text>
  </g>

  <!-- tool track: the gap orangebox never sees -->
  <g class="r12">
    <line x1="74" y1="410" x2="74" y2="440" stroke="#2A2E36"/>
    <rect x="86" y="416" width="94" height="17" rx="3" fill="#24365E"/>
    <text class="mono" x="95" y="428" font-size="9.5" fill="#C3D5FB">▪ get_weather</text>
    <rect x="188" y="416" width="94" height="17" rx="3" fill="#E5484D" fill-opacity=".16" stroke="#5C2226"/>
    <text class="mono red" x="197" y="428" font-size="9.5">▲ get_weather</text>
    <text class="mono dim" x="296" y="428" font-size="9.5">client-side ≈ 2.1 s</text>
  </g>

  <!-- call 03: streaming, then resolved -->
  <g class="r15">
    <circle class="pulse" cx="34" cy="474" r="9" fill="none" stroke="#FF5A1F" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="34" cy="474" r="4.5" fill="none" stroke="#FF5A1F" stroke-width="2"/>
  </g>
  <g class="r18">
    <circle cx="34" cy="474" r="4.5" fill="#FF5A1F"/>
  </g>

  <g class="r14">
    <text class="mono dim" x="52" y="472" font-size="10.5">call 03</text>
    <text class="sans" x="104" y="472" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
    <rect x="250" y="462" width="64" height="15" rx="3" fill="none" stroke="#7A2C10"/>
    <text class="mono org" x="282" y="473" text-anchor="middle" font-size="9.5">▮ stream</text>
  </g>

  <g class="r18">
    <text class="mono txt" x="204" y="472" font-size="11">4.7 s</text>
    <rect x="322" y="462" width="94" height="15" rx="3" fill="none" stroke="#2A2E36"/>
    <text class="mono dim" x="369" y="473" text-anchor="middle" font-size="9.5">stop: end_turn</text>
    <text class="mono dim" x="102" y="490" font-size="10.5">6.1k in / 289 out</text>
    <text class="mono dim" x="216" y="490" font-size="10.5">$0.039 est.</text>
    <text class="mono dim" x="298" y="490" font-size="10.5">ttft 108 ms</text>
  </g>

  <!-- closing hint -->
  <g class="r20">
    <text class="mono dim" x="52" y="524" font-size="10">click any call to read the exact prompt the model saw · Diff shows what changed since the call before</text>
  </g>
</svg>
