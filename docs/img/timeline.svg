<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="The orangebox timeline: three recorded LLM calls with tool activity, latency, tokens and estimated cost">
  <defs>
    <style>
      .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .sans { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- window -->
  <rect x="0" y="0" width="900" height="470" rx="7" fill="#14161A"/>
  <rect x=".5" y=".5" width="899" height="469" rx="6.5" fill="none" stroke="#2A2E36"/>

  <!-- ============ runs pane ============ -->
  <rect x="1" y="1" width="212" height="468" fill="#16181D"/>
  <line x1="213" y1="1" x2="213" y2="469" stroke="#2A2E36"/>

  <text class="sans" x="18" y="30" font-size="13" font-weight="700" fill="#E8EAED"><tspan fill="#FF5A1F">▮ </tspan>orangebox</text>
  <text class="mono" x="196" y="30" text-anchor="end" font-size="9.5" letter-spacing="1.4" fill="#9AA0A8">2 RUNS</text>
  <line x1="1" y1="45" x2="213" y2="45" stroke="#2A2E36"/>

  <!-- selected run -->
  <rect x="1" y="46" width="212" height="52" fill="#22262E"/>
  <rect x="1" y="46" width="2" height="52" fill="#FF5A1F"/>
  <text class="sans" x="18" y="66" font-size="12" font-weight="500" fill="#E8EAED">weather comparison agent</text>
  <text class="mono" x="196" y="66" text-anchor="end" font-size="10" fill="#9AA0A8">just now</text>
  <text class="mono" x="18" y="85" font-size="10.5" fill="#9AA0A8">3 calls</text>
  <text class="mono" x="72" y="85" font-size="10.5" fill="#9AA0A8">$0.080</text>
  <line x1="1" y1="98" x2="213" y2="98" stroke="#1B1E24"/>

  <text class="sans" x="18" y="119" font-size="12" fill="#E8EAED">retry storm repro</text>
  <text class="mono" x="196" y="119" text-anchor="end" font-size="10" fill="#9AA0A8">12:41</text>
  <text class="mono" x="18" y="138" font-size="10.5" fill="#9AA0A8">2 calls</text>
  <text class="mono" x="72" y="138" font-size="10.5" fill="#9AA0A8">$0.017</text>
  <text class="mono" x="124" y="138" font-size="10.5" fill="#E5484D">▲ 1 error</text>
  <line x1="1" y1="151" x2="213" y2="151" stroke="#1B1E24"/>

  <line x1="1" y1="438" x2="213" y2="438" stroke="#2A2E36"/>
  <text class="mono" x="18" y="456" font-size="9" fill="#9AA0A8">This database contains your prompts.</text>

  <!-- ============ run header ============ -->
  <text class="sans" x="234" y="30" font-size="13" font-weight="600" fill="#E8EAED">weather comparison agent</text>
  <text class="mono" x="614" y="30" font-size="10.5" fill="#9AA0A8">11k in / 441 out</text>
  <text class="mono" x="722" y="30" font-size="10.5" fill="#9AA0A8">$0.080 est.</text>
  <text class="mono" x="800" y="30" font-size="10.5" fill="#9AA0A8">27.4 s</text>
  <rect x="842" y="18" width="44" height="17" rx="3" fill="#1C1F25" stroke="#2A2E36"/>
  <text class="mono" x="864" y="30" text-anchor="middle" font-size="9.5" fill="#9AA0A8">Export</text>
  <line x1="213" y1="45" x2="900" y2="45" stroke="#2A2E36"/>

  <!-- ============ call 01 ============ -->
  <circle cx="248" cy="80" r="4.5" fill="#FF5A1F"/>
  <text class="mono" x="266" y="78" font-size="10.5" fill="#9AA0A8">call 01</text>
  <text class="sans" x="318" y="78" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
  <text class="mono" x="416" y="78" font-size="11" fill="#E8EAED">1.9 s</text>
  <rect x="460" y="68" width="94" height="15" rx="3" fill="none" stroke="#2A2E36"/>
  <text class="mono" x="507" y="79" text-anchor="middle" font-size="9.5" fill="#9AA0A8">stop: end_turn</text>
  <text class="mono" x="316" y="96" font-size="10.5" fill="#9AA0A8">2.4k in / 38 out</text>
  <text class="mono" x="424" y="96" font-size="10.5" fill="#9AA0A8">$0.024 est.</text>

  <!-- ============ call 02 ============ -->
  <circle cx="248" cy="136" r="4.5" fill="#FF5A1F"/>
  <text class="mono" x="266" y="134" font-size="10.5" fill="#9AA0A8">call 02</text>
  <text class="sans" x="318" y="134" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
  <text class="mono" x="416" y="134" font-size="11" fill="#E8EAED">3.2 s</text>
  <rect x="460" y="124" width="84" height="15" rx="3" fill="#5B8DEF" fill-opacity=".12" stroke="#24365E"/>
  <text class="mono" x="502" y="135" text-anchor="middle" font-size="9.5" fill="#5B8DEF">stop: tool_use</text>
  <text class="mono" x="316" y="152" font-size="10.5" fill="#9AA0A8">2.7k in / 114 out</text>
  <text class="mono" x="430" y="152" font-size="10.5" fill="#9AA0A8">$0.017 est.</text>

  <!-- tool track: what the client did while orangebox was not watching -->
  <line x1="288" y1="164" x2="288" y2="196" stroke="#2A2E36"/>
  <rect x="300" y="170" width="94" height="17" rx="3" fill="#24365E"/>
  <text class="mono" x="309" y="182" font-size="9.5" fill="#C3D5FB">▪ get_weather</text>
  <rect x="402" y="170" width="94" height="17" rx="3" fill="#E5484D" fill-opacity=".16" stroke="#5C2226"/>
  <text class="mono" x="411" y="182" font-size="9.5" fill="#F4A9AB">▲ get_weather</text>
  <text class="mono" x="510" y="182" font-size="9.5" fill="#9AA0A8">client-side ≈ 2.1 s</text>

  <!-- ============ call 03 — streaming, in flight ============ -->
  <circle cx="248" cy="228" r="9" fill="none" stroke="#FF5A1F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="248" cy="228" r="4.5" fill="none" stroke="#FF5A1F" stroke-width="2"/>
  <text class="mono" x="266" y="226" font-size="10.5" fill="#9AA0A8">call 03</text>
  <text class="sans" x="318" y="226" font-size="12" font-weight="500" fill="#E8EAED">claude-opus-5</text>
  <text class="mono" x="416" y="226" font-size="11" fill="#E8EAED">4.7 s</text>
  <rect x="460" y="216" width="64" height="15" rx="3" fill="none" stroke="#7A2C10"/>
  <text class="mono" x="492" y="227" text-anchor="middle" font-size="9.5" fill="#FF5A1F">▮ stream</text>
  <text class="mono" x="316" y="244" font-size="10.5" fill="#9AA0A8">6.1k in / 289 out</text>
  <text class="mono" x="430" y="244" font-size="10.5" fill="#9AA0A8">$0.039 est.</text>
  <text class="mono" x="512" y="244" font-size="10.5" fill="#9AA0A8">ttft 108 ms</text>

  <!-- idle gap -->
  <text class="mono" x="288" y="284" font-size="9.5" letter-spacing="1.2" fill="#9AA0A8">· · ·   41 s idle   · · ·</text>

  <!-- ============ the detail drawer, cut off at the pane edge ============ -->
  <line x1="620" y1="310" x2="900" y2="310" stroke="#2A2E36"/>
  <rect x="620" y="310" width="280" height="159" fill="#1C1F25"/>
  <line x1="620" y1="310" x2="620" y2="469" stroke="#2A2E36"/>

  <text class="mono" x="636" y="330" font-size="9.5" letter-spacing="1.3" fill="#9AA0A8">CALL 02 · ANTHROPIC</text>
  <line x1="620" y1="340" x2="900" y2="340" stroke="#2A2E36"/>
  <text class="mono" x="636" y="358" font-size="10" fill="#E8EAED">Conversation</text>
  <line x1="632" y1="364" x2="704" y2="364" stroke="#FF5A1F" stroke-width="2"/>
  <text class="mono" x="716" y="358" font-size="10" fill="#9AA0A8">Request</text>
  <text class="mono" x="776" y="358" font-size="10" fill="#9AA0A8">Diff</text>
  <text class="mono" x="816" y="358" font-size="10" fill="#9AA0A8">Timing</text>

  <rect x="634" y="376" width="46" height="14" rx="3" fill="#33383F"/>
  <text class="mono" x="640" y="387" font-size="9" fill="#CFD4DA">system</text>
  <rect x="634" y="398" width="252" height="26" rx="3" fill="#15181D" stroke="#2A2E36"/>
  <text class="mono" x="642" y="415" font-size="9.5" fill="#CDD2D8">You are a concise weather assistant…</text>

  <rect x="634" y="432" width="80" height="14" rx="3" fill="#24365E"/>
  <text class="mono" x="640" y="443" font-size="9" fill="#C3D5FB">▪ tool_use</text>
  <rect x="634" y="452" width="252" height="14" rx="3" fill="#15181D" stroke="#24365E"/>
  <text class="mono" x="642" y="463" font-size="9.5" fill="#CDD2D8">{ "city": "Paris", "units": "metric" }</text>
</svg>
